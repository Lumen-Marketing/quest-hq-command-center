name: Production Guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-guardian
  queue: max
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Verify deployed production
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture checked-out SHA
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run production smoke check
        id: smoke
        continue-on-error: true
        run: npm run smoke:prod -- --base-url https://www.questbase.io --expect-sha "${{ steps.revision.outputs.sha }}"

      - name: Open or update failure incident
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Production Guardian] Quest HQ production smoke check failing';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (!incident) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Production smoke check failed. Run: ${runUrl}`,
              });
            } else {
              if (incident.state !== 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Production smoke check failed again. Run: ${runUrl}`,
              });
            }

      - name: Close recovered incident
        if: always() && steps.smoke.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Production Guardian] Quest HQ production smoke check failing';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Production smoke check recovered. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: 'closed',
              });
            }

      - name: Propagate smoke failure
        if: always() && steps.smoke.outcome == 'failure'
        run: exit 1
