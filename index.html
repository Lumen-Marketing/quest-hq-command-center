    <meta name="theme-color" content="#e8ebef" />
    <title>Questbase</title>
    <!-- The mark sits on a transparent field, so the tab icon needs two versions: its
         arcs are orange and near-black, and the near-black disappears on a dark tab bar.
         The dark variant lightens that ink. Browsers that ignore `media` on icon links
         fall back to the first, which is the light one. All generated from one piece of
         artwork by scripts/build-brand-icons.py. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="%BASE_URL%icons/favicon-16-dark.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Questbase" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <!-- Tabler icons are imported via src/tabler-icons.css (generated subset, ~61 KB
         vs the 799 KB full font). Vite bundles and hashes it with the entry CSS. -->
  </head>

         render, and it sat in the entry chunk purely to emit a constant. Kept OUTSIDE
         #app so re-rendering the shell cannot wipe it -- <use href="#q-..."> resolves
         against the whole document, so the symbols stay reachable either way. It also
         means icons are painted by the HTML parser, before any JavaScript runs. -->
